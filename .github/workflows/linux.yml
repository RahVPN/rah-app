name: Linux build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev liblzma-dev
      - run: ./tools/setup_linux.sh
      - run: ./tools/package_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rahvpn-linux
          path: dist/*.tar.gz
